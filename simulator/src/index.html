<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>pp simulator playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>pp simulator</h1>
    <nav><a href="../">Manual</a></nav>
  </header>
  <div class="toolbar" aria-label="Replay controls">
    <button id="run">Run source</button>
    <button id="run-scenario" disabled>Run scenario</button>
    <button id="pause-run" disabled>Pause run</button>
    <button id="resume-run" disabled>Resume run</button>
    <button id="step-run" disabled>Step run</button>
    <button id="stop-run" disabled>Stop run</button>
    <button id="export" disabled>Export run</button>
    <select id="example" aria-label="Example"></select>
    <label class="file">Open recording <input id="recording" type="file" accept=".jsonl,.json,application/jsonl,application/json"></label>
    <button id="step-back" title="Previous event">◀ Step</button>
    <button id="play">Play</button>
    <button id="step">Step ▶</button>
    <input id="seek" type="range" min="0" value="0" aria-label="Event cursor">
    <output id="status">Loading recording…</output>
  </div>
  <main>
    <section class="workspace panel" aria-labelledby="source-title">
      <h2 id="source-title">Source and scenario</h2>
      <div class="editors">
        <label>Program <select id="surface"><option value="playground.pp">.pp</option><option value="playground.ppl">.ppl</option></select>
          <textarea id="source" spellcheck="false"></textarea></label>
        <label>Scenario (.ppsim)<textarea id="scenario" spellcheck="false">scenario v1 {
  seed: 0,
  program: { file: "playground.pp", argv: [] },
  hosts: { browser: { cores: 1, store: cold } },
  links: [], grants: [], actions: [],
  expect: [{ eventually: { event: "run.finished" } }]
}</textarea></label>
      </div>
      <pre id="diagnostics" aria-live="polite">Ready. Browser mode uses virtual host services.</pre>
      <svg id="topology" viewBox="0 0 900 240" role="img" aria-label="Recorded hosts and nodes"></svg>
    </section>
    <section class="timeline panel" aria-labelledby="events-title">
      <h2 id="events-title">Events</h2>
      <div id="filters" class="filters"></div>
      <input id="query" type="search" placeholder="Filter event text" aria-label="Filter events">
      <ol id="events"></ol>
    </section>
    <aside class="inspector panel" aria-labelledby="inspector-title">
      <h2 id="inspector-title">Inspector</h2>
      <div id="inspector"></div>
    </aside>
  </main>
  <script src="pp-browser.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
