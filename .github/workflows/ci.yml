name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TEST_JOBS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install sbcl dune
          else
            sudo apt-get update
            sudo apt-get install -y sbcl ocaml-dune libdigest-sha-perl
          fi

      - name: Build saved image
        run: scripts/build-lisp.sh --output lisp/pp

      - name: Architecture gates
        run: scripts/check-architecture.sh

      - name: Test suite
        run: scripts/run-tests.sh bin/pp

  clean-export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl
      - name: Clean exported-source gate
        run: ./scripts/check-clean-export.sh
