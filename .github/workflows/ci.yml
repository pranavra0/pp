name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
env:
  # Deep-recursion exceeds the 120-second per-case default on GitHub-hosted
  # runners; retain a bounded per-case watchdog.
  TEST_CASE_TIMEOUT: "600"

# Superseded PR runs are cancelled; pushes to master always run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sbcl libdigest-sha-perl

      - name: Build saved image
        run: scripts/build-lisp.sh --output lisp/pp

      - name: Architecture gates
        run: scripts/check-architecture.sh

      - name: Test suite
        run: scripts/run-tests.sh bin/pp

  clean-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sbcl
      - name: Clean exported-source gate
        # The gate script defaults to serial; fan out across runner cores.
        run: TEST_JOBS="$(nproc)" ./scripts/check-clean-export.sh
